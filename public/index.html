<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taboo CEFR — Explainer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="explainer">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">T</span> Taboo <span class="brand-sub">CEFR</span></div>
    <div class="topbar-actions">
      <button class="btn ghost" id="open-class" title="Open the class view in a new window for the projector">⧉ Class view</button>
      <button class="btn ghost" id="manage-cards-top">Cards</button>
    </div>
  </header>

  <!-- SETUP -->
  <main id="setup" class="setup">
    <div id="resume-banner" class="banner" hidden>
      <span>A game is still in progress.</span>
      <button class="btn primary" id="resume">Resume game</button>
    </div>

    <section class="panel">
      <div class="panel-head"><h2><span class="step">1</span> Card sets</h2>
        <button class="btn ghost small" id="manage-cards">Manage cards…</button></div>
      <div id="set-grid" class="set-grid"></div>
      <p class="hint" id="deck-count"></p>
    </section>

    <section class="panel">
      <div class="panel-head"><h2><span class="step">2</span> Teams</h2>
        <div class="stepper">
          <button class="btn ghost small" id="team-minus" aria-label="Fewer teams">−</button>
          <span id="team-count">2</span>
          <button class="btn ghost small" id="team-plus" aria-label="More teams">+</button>
        </div></div>
      <div id="team-names" class="team-names"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2><span class="step">3</span> Rules</h2></div>
      <div class="rule">
        <div class="rule-label">Turn timer</div>
        <div class="rule-body">
          <div class="seg" id="timer-presets"></div>
          <label class="inline">or <input type="number" id="seconds" min="5" max="600" step="5"> seconds</label>
        </div>
      </div>
      <div class="rule">
        <div class="rule-label">Skips</div>
        <div class="rule-body">
          <div class="seg" id="skip-modes">
            <button data-mode="free">Free</button>
            <button data-mode="limited">Some free, then −1</button>
            <button data-mode="penalty">Always −1</button>
          </div>
          <label class="inline" id="free-skips-wrap"><input type="number" id="free-skips" min="0" max="20"> free per turn</label>
        </div>
      </div>
      <div class="rule">
        <div class="rule-label">Taboo word said</div>
        <div class="rule-body"><label class="check"><input type="checkbox" id="taboo-penalty"> Costs the team 1 point</label></div>
      </div>
      <div class="rule">
        <div class="rule-label">Game length</div>
        <div class="rule-body"><label class="inline"><input type="number" id="turns-per-team" min="0" max="50"> turns per team <span class="muted">(0 = until you end it)</span></label></div>
      </div>
      <div class="rule">
        <div class="rule-label">Extras</div>
        <div class="rule-body">
          <label class="check"><input type="checkbox" id="reveal-words"> Show the turn's words on the class view when time is up</label>
          <label class="check"><input type="checkbox" id="sounds"> Sound effects</label>
        </div>
      </div>
    </section>

    <div class="setup-actions">
      <button class="btn primary big" id="start">Start game</button>
    </div>
  </main>

  <!-- PLAY -->
  <main id="play" class="play" hidden>
    <div class="playbar">
      <div class="team-chip" id="cur-team"></div>
      <div class="timer" id="timer">60</div>
      <div class="playbar-actions">
        <button class="btn ghost small" id="pause" title="Pause (P)">Pause</button>
        <button class="btn ghost small" id="end-game">End game</button>
      </div>
    </div>
    <div id="stage" class="stage"></div>
    <div id="scoreboard" class="scoreboard"></div>
  </main>

  <!-- CARD MANAGER -->
  <dialog id="cards-dlg" class="dlg">
    <div class="dlg-head">
      <h2>Manage cards</h2>
      <button class="btn ghost small" id="cards-close">Done</button>
    </div>
    <div class="tabs" id="cm-tabs"></div>
    <form id="add-form" class="add-form">
      <input id="add-word" placeholder="New word" required maxlength="40">
      <input id="add-taboo" placeholder="Taboo words, separated by commas" required>
      <select id="add-level"></select>
      <button class="btn primary small">Add card</button>
    </form>
    <div class="cm-tools">
      <input type="search" id="cm-search" placeholder="Search this set…">
      <span class="muted" id="cm-count"></span>
      <button class="btn ghost small" id="cm-include-all">Include all</button>
      <button class="btn ghost small" id="cm-exclude-all">Exclude all</button>
    </div>
    <div id="cm-list" class="cm-list"></div>
    <div class="dlg-foot">
      <span class="muted">Your added cards and exclusions are saved in this browser.</span>
      <button class="btn ghost small" id="export">Export</button>
      <label class="btn ghost small">Import<input type="file" id="import" accept="application/json" hidden></label>
    </div>
  </dialog>

  <script type="module" src="js/explainer.js"></script>
</body>
</html>
