<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hot Seat — Class view</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Taboo CEFR">
  <meta name="theme-color" content="#ffc61a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>/* edition first, so the page never flashes the wrong one (details in js/edition.js) */
    (function () { var d = document.documentElement, h = /nadu/i.test(location.hostname) ? 'nadu' : 'classroom';
      try { var a = new URLSearchParams(location.search).get('edition'); if (a === 'nadu' || a === 'classroom') sessionStorage.setItem('edition', a); h = sessionStorage.getItem('edition') || h; } catch (e) {}
      d.dataset.edition = h; })();</script>
  <script type="module" src="js/edition.js"></script>
</head>
<body class="classview hs-class">
  <button class="fs-btn" id="fullscreen" title="Full screen (F)">⛶</button>
  <div class="hs-bar" id="hs-bar"><div></div></div>
  <main id="cv" class="cv"></main>
  <div id="flash" class="flash"></div>
  <script type="module" src="js/hotseat-class.js"></script>
</body>
</html>
